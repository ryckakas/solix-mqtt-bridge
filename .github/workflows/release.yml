name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Queue rather than cancel: a release cancelled halfway can leave assets or images half-published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload assets
      packages: write # push images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs the full history and tags for the changelog
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Never restore a cache that a pull-request run could have written.
          cache: false

      # Dockerfile.release only copies binaries, so no QEMU is needed for the foreign platforms.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .goreleaser.yaml enables sboms, which shell out to syft.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Catches drift between .goreleaser.yaml's archive names and scripts/install.sh, against the real release.
  installer-smoke:
    name: Installer smoke test
    needs: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checksums list install.sh and every Linux archive
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          v="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          curl -fsSLo "${RUNNER_TEMP}/sums.txt" "${base}/solix-mqtt-bridge_${v}_checksums.txt"
          for f in install.sh "solix-mqtt-bridge_${v}_linux_amd64.tar.gz" \
            "solix-mqtt-bridge_${v}_linux_arm64.tar.gz" "solix-mqtt-bridge_${v}_linux_armv7.tar.gz"; do
            grep -q "  ${f}\$" "${RUNNER_TEMP}/sums.txt" || { echo "::error::${f} is missing from the checksums"; exit 1; }
          done
          curl -fsSLo "${RUNNER_TEMP}/install.sh" "${base}/install.sh"
          (cd "${RUNNER_TEMP}" && grep "  install.sh\$" sums.txt | sha256sum -c -)

      # Same image as scripts/install_integration_test.go: Debian trixie with curl, the base of Raspberry Pi OS.
      - name: Install the release with its own installer
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: buildpack-deps:trixie-curl@sha256:3dd78c060b4d7c97b426d0160f7d8876c84fbf2fc36e651e9c75620ac9a7da24
        run: |
          docker run --rm -e TAG -v "${PWD}/scripts/testdata/shims:/opt/shims:ro" -v "${RUNNER_TEMP}/install.sh:/opt/install.sh:ro" \
            "${IMAGE}" sh -euc '
              export PATH="/opt/shims:${PATH}"
              mkdir -p /run/systemd/system /etc/systemd/system
              sh /opt/install.sh "${TAG}"
              /usr/local/bin/solix-mqtt-bridge -version | grep -F "solix-mqtt-bridge ${TAG#v} "
            '
