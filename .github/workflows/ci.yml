name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Must stay a v2.x release: .golangci.yml uses the v2 schema.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      # Version pinned by the `tool` line in go.mod.
      - name: Cognitive complexity (bonsai-lint)
        run: go tool bonsai-lint --format github .

      # Version pinned by the `tool` line in go.mod; the target fails on any finding.
      - name: Dead code (deadcode)
        run: make deadcode

      - name: Read-only gate (no Modbus writes outside the simulator)
        run: make readonly

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Informational only; the guard keeps a failed test run from adding a confusing cover error.
      - name: Coverage summary
        if: always()
        run: |
          if [ -s coverage.out ]; then
            go tool cover -func=coverage.out || echo "note: coverage.out had no usable data"
          else
            echo "note: coverage.out is empty or missing - the test step likely failed above"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: warn

  integration:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Hosted runners are discarded after the job, so the reaper container adds nothing.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race + integration tag)
        run: go test -race -tags=integration ./...

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # comment findings on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Not govulncheck-action: it persists the job token and installs @latest.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      # JSON mode exits 0 even on findings, so the report decides: it is empty when nothing reachable is affected.
      - name: Run govulncheck
        run: |
          govulncheck -format json ./... > "${RUNNER_TEMP}/govulncheck.json"
          jq -rs -f .github/govulncheck-report.jq "${RUNNER_TEMP}/govulncheck.json" \
            | tee "${RUNNER_TEMP}/govulncheck.md" >> "${GITHUB_STEP_SUMMARY}"

      # Fork and Dependabot PRs get a read-only token, so they can't comment.
      - name: Comment findings on the PR
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          report="${RUNNER_TEMP}/govulncheck.md"
          if [ -s "${report}" ]; then
            gh pr comment "${PR}" --edit-last --create-if-none --body-file "${report}"
          elif [ "$(gh pr view "${PR}" --json comments --jq '[.comments[] | select(.viewerDidAuthor)] | length')" -gt 0 ]; then
            gh pr comment "${PR}" --edit-last --body 'govulncheck: no reachable vulnerabilities.'
          fi

      - name: Fail on findings
        run: |
          if [ -s "${RUNNER_TEMP}/govulncheck.md" ]; then
            cat "${RUNNER_TEMP}/govulncheck.md"
            echo "::error::govulncheck found reachable vulnerabilities"
            exit 1
          fi

  # Online, unlike `make zizmor`: the token enables the audits that verify each SHA pin against its action's repo.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Image pinned by digest: Dependabot doesn't track images in `run:` steps.
      - name: Audit GitHub Actions configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            --env GH_TOKEN \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101 \
            --collect=all --strict-collection --format=github .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the tip
          persist-credentials: false

      # Image pinned by GITLEAKS_IMAGE in the Makefile.
      - name: Scan git history for secrets
        run: make gitleaks

  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go.mod and go.sum match go mod tidy
        run: make tidy-check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pinned and checksummed, unlike the runner's own: it lints every `run:` script and the installer.
      - name: Install ShellCheck
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "${RUNNER_TEMP}/${archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xJf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          sudo install "${RUNNER_TEMP}/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # Version pinned by ACTIONLINT_VERSION in the Makefile.
      - name: Lint workflows
        run: make actionlint

      - name: Lint shell scripts
        run: make shellcheck

  unit-check:
    name: systemd unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In Debian, the base of Raspberry Pi OS, rather than with the runner's systemd.
      - name: systemd-analyze verify and security
        run: make unit-check

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  goreleaser-check:
    name: GoReleaser config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check

  image:
    name: Container image (multi-arch, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cross-compiles in the build stage, so no QEMU is needed.
      - name: Build for amd64, arm64 and arm/v7
        run: |
          go_version="$(sed -n 's/^toolchain go//p' go.mod)"
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            --build-arg GO_VERSION="${go_version}" \
            .
