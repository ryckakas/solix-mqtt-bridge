version: 2
updates:
  # Also bumps the bonsai-lint `tool` line, since it is a require in go.mod.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A week lets a compromised or yanked release surface first; security updates skip it.
    cooldown:
      default-days: 7
    # Majors stay out of the group, so each arrives as its own PR and can't hold back the routine bumps.
    groups:
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
